services:
  collector:
    build: .
    image: qde-collector
    restart: unless-stopped
    environment:
      QDE_SOURCE: binance
      QDE_BASE_DIR: /data
      QDE_SYMBOLS: BTCUSDT,ETHUSDT,SOLUSDT
      QDE_KINDS: trades,depth,book_ticker
    volumes:
      - ./data:/data
      # SOURCE credentials only. Read-only, and deliberately the whole directory so a
      # newly registered source needs no compose edit -- qde.env.load_source_secrets
      # loads a file only when it is named after a REGISTERED SOURCE, which is what
      # keeps this mount safe to widen.
      #
      # R2 WRITE credentials are NOT here: they live in secrets-infra/, which nothing
      # mounts. maintain.sh sources that on the host and passes the values with -e, so
      # write access to the public bucket never sits on disk inside a job that only
      # reads APIs and writes local Parquet.
      #
      # The BOM-robust loader tolerates a PowerShell-written file; missing files no-op.
      - ./secrets:/app/secrets:ro
    stop_grace_period: 30s

  # Second microstructure venue: Coinbase's public feed, same collector image
  # driven by a different venue adapter (QDE_SOURCE). Writes to the SAME /data
  # lake -- the source= partition keeps it separate from Binance, so the one
  # nightly compact+sync ships both venues. No secrets mount: the feed is public.
  collector-coinbase:
    build: .
    image: qde-collector
    restart: unless-stopped
    environment:
      QDE_SOURCE: coinbase
      QDE_BASE_DIR: /data
      QDE_SYMBOLS: BTCUSDT,ETHUSDT,SOLUSDT
      QDE_KINDS: trades,depth,book_ticker
    volumes:
      - ./data:/data
    stop_grace_period: 30s
