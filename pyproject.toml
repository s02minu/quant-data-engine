[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qde"
version = "0.1.0"
description = "Quant data engine - market data infrastructure."
requires-python = ">=3.12"
# Upper-bounded at the next MAJOR, lower-bounded at the version proven in
# production. Unbounded, a rebuild of the 24/7 collector could pull `pandas 4` or
# `ccxt 5` and change runtime behaviour with no code change and no failing test —
# the image is rebuilt on every deploy, so the drift arrives silently and at the
# worst moment. Deliberately NOT exact pins: patch and minor releases carry security
# fixes, and a lockfile across 191 transitive packages is maintenance this project
# does not have a maintainer for. Bump a ceiling only after the suite passes on it.
dependencies = [
    "pandas>=3.0,<4",
    "requests>=2.32,<3",
    "yfinance>=1.5,<2",
    "ccxt>=4.5,<5",
    "pyarrow>=25.0,<26",
    "duckdb>=1.5,<2",
    "pandas-market-calendars>=5.4,<6",
    "websockets>=17.0,<18",
    "boto3>=1.40,<2",
    "structlog>=26.1,<27",
    "pydantic-settings>=2.15,<3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]
# The drafting agent (qde.author). Optional because nothing in the pipeline needs it:
# the nightly, the checks and the container that runs candidate code all run without
# it, and the container in particular must NOT carry a code-generation dependency.
agent = [
    "anthropic>=1.0,<2",
]
# The dbt transformation layer (Phase 8). Kept out of the core deps so a client
# that only queries the lake stays light, but installed into the VPS image
# (`pip install .[transform]`) so the nightly can rebuild gold. dbt-duckdb reads
# bronze Parquet and materializes gold Parquet in-place -- zero warehouse cost.
transform = [
    "dbt-core>=1.12,<2",
    "dbt-duckdb>=1.11,<2",
]
# Orchestration (Phase 7): registry-driven Dagster assets over the batch pipeline.
# Local/dev-only by design (ROADMAP 7 + the 3.7 GB VPS): `dagster dev` shows the
# asset graph and lineage; the lightweight VPS cron stays the production runner, so
# this group is NOT installed into the VPS image. The dbt project is surfaced as a
# single asset that shells out to `dbt build` (see orchestration/), rather than via
# dagster-dbt -- its transitive dbt-extractor has no Windows wheel and needs a Rust
# toolchain to build, not worth it for a dev-only tool. Needs `.[transform]` too.
orchestration = [
    "dagster",
    "dagster-webserver",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", ".venv"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear, SIM simplify
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
# Third-party libs (pandas, duckdb, boto3, ...) ship no stubs here; don't flood
# on those. Tighten module-by-module later as hints are added.
ignore_missing_imports = true