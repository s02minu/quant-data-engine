[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qde"
version = "0.1.0"
description = "Quant data engine - market data infrastructure."
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "requests",
    "yfinance",
    "pyarrow",
    "duckdb",
    "pandas-market-calendars",
    "websockets",
    "boto3",
    "structlog",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", ".venv"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear, SIM simplify
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
# Third-party libs (pandas, duckdb, boto3, ...) ship no stubs here; don't flood
# on those. Tighten module-by-module later as hints are added.
ignore_missing_imports = true