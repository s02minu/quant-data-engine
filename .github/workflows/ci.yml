name: CI

# Runs the same gates as local dev — ruff lint, mypy, pytest — on every push to
# main and every pull request. The test suite is fully offline (network
# boundaries are mocked in tests/conftest.py), so CI needs no secrets or network.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref cancels an in-flight run for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor from pyproject (requires-python >=3.11) and the dev runtime (3.14).
        python-version: ["3.11", "3.14"]
    name: py${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest -q
